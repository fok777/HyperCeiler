name: API 102 Build

on:
  push:
    branches: [a13_eol_api102]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_app:
    runs-on: ubuntu-latest
    name: Build App (Debug)
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle (Debug)
        id: gradle
        shell: bash
        run: |
          chmod +x ./gradlew
          set -o pipefail
          for attempt in 1 2 3; do
            echo "=== build attempt $attempt ==="
            if ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log; then
              echo "rc=0" > build.rc
              break
            fi
            echo "rc=1" > build.rc
            if grep -qE "Could not resolve|Received status code 5|Could not GET|Could not download" build.log; then
              echo "网络导致的依赖下载失败，等待后重试"
              sleep 30
              continue
            fi
            break
          done
          test "$(cat build.rc)" = "rc=0"

      - name: Publish build log to ci-logs branch
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . --quiet || true
          mkdir -p logs
          tail -n 3000 build.log > logs/full.log
          grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|Could not resolve|Could not find" build.log | head -n 300 > logs/errors.log || true
          cat build.rc >> logs/errors.log || true
          git add logs
          git commit -m "build log for run ${{ github.run_number }}"
          git push -f https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git ci-logs

      - name: Locate APK
        if: success()
        shell: bash
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename "$APK_FILE" .apk)" >> $GITHUB_ENV

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9
